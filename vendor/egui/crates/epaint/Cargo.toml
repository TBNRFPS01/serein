[package]
name = "epaint"
version = "0.36.2"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
description = "Minimal 2D graphics library for GUI work"
edition = "2024"
rust-version.workspace = true
homepage = "https://github.com/emilk/egui/tree/main/crates/epaint"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emilk/egui/tree/main/crates/epaint"
categories = ["graphics", "gui"]
keywords = ["graphics", "gui", "egui"]
include = ["../../LICENSE-APACHE", "../../LICENSE-MIT", "**/*.rs", "Cargo.toml"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[lib]


[features]
default = ["default_fonts"]

## [`bytemuck`](https://docs.rs/bytemuck) enables you to cast [`Vertex`] to `&[u8]`.
bytemuck = ["dep:bytemuck", "emath/bytemuck", "ecolor/bytemuck"]

## [`cint`](https://docs.rs/cint) enables interoperability with other color libraries.
cint = ["ecolor/cint"]

## Enable the [`hex_color`] macro.
color-hex = ["ecolor/color-hex"]

## Support bitmap (`sbix`, `CBDT`) and `COLR` glyphs, i.e. color emoji fonts like Apple Color Emoji and Segoe UI Emoji.
##
## Adds a PNG decoder to the binary, so it is off by default. `eframe` enables it on native via `egui_system_fonts`.
color_fonts = ["vello_cpu/png", "vello_cpu/text"]

## If set, epaint will use `include_bytes!` to bundle some fonts.
## If you plan on specifying your own fonts you may disable this feature.
default_fonts = ["epaint_default_fonts"]

## [`mint`](https://docs.rs/mint) enables interoperability with other math libraries such as [`glam`](https://docs.rs/glam) and [`nalgebra`](https://docs.rs/nalgebra).
mint = ["emath/mint"]

## Bundle the monochrome emoji fonts `NotoEmoji-Regular` and `emoji-icon-font`,
## and put them in the default [`text::FontDefinitions`].
##
## They add about 1 MB to the binary, and are only needed if you want the same
## (monochrome) emoji on every platform, instead of the platform's own color emoji
## (see [`text::GlyphRasterizer`] and [`text::FontProvider`]).
monochrome_emoji_fonts = ["default_fonts", "epaint_default_fonts/monochrome_emoji_fonts"]

## Enable parallel tessellation using [`rayon`](https://docs.rs/rayon).
##
## This can help performance for graphics-intense applications.
rayon = ["dep:rayon"]

## Allow serialization using [`serde`](https://docs.rs/serde).
serde = [
  "dep:serde",
  "ahash/serde",
  "ecolor/serde",
  "emath/serde",
  "font-types/serde",
  "smallvec/serde",
]

## Change Vertex layout to be compatible with unity
unity = []

## Override and disable the unity feature
## This exists, so that when testing with --all-features, snapshots render correctly.
_override_unity = []

[dependencies]
emath = { version = "0.36.2", git = "https://github.com/emilk/egui", rev = "441971a776322a482e371775219380eca812cfa9", default-features = false }
ecolor = { version = "0.36.2", git = "https://github.com/emilk/egui", rev = "441971a776322a482e371775219380eca812cfa9", default-features = false }

ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }
font-types = { version = "0.12.4", default-features = false, features = ["std"] }
harfrust = "0.12.0"
log = { version = "0.4.34", features = ["std"] }
nohash-hasher = "0.2.0"
parking_lot = "0.12.5"
profiling = { version = "1.0", default-features = false }
self_cell = "1.3"
skrifa = { version = "0.44.0", default-features = false, features = ["std", "autohint_shaping"] }
smallvec = "1.16"
unicode-general-category = "1.1"
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"] }
unicode-segmentation = "1.13"
unicode-bidi = "=0.3.18"
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline"] }

#! ### Optional dependencies
bytemuck = { version = "1.25", optional = true, features = ["derive"] }

## Enable this when generating docs.
document-features = { version = "0.2.12", optional = true }

rayon = { version = "1.12", optional = true }

## Allow serialization using [`serde`](https://docs.rs/serde) .
serde = { version = "1.0", optional = true, features = ["derive", "rc"] }

epaint_default_fonts = { version = "0.36.2", git = "https://github.com/emilk/egui", rev = "441971a776322a482e371775219380eca812cfa9", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
mimalloc = "0.1.52"
similar-asserts = "2.0"


[[bench]]
name = "benchmark"
harness = false
